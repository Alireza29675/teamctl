version: "2.0.0"

broker:
  type: sqlite
  path: state/mailbox.db

supervisor:
  type: tmux
  tmux_prefix: pr-

budget:
  daily_usd_limit: 5.0
  message_ttl_hours: 168 # 7 days. research context compounds, give it room

hitl:
  globally_sensitive_actions:
    - external_email
    - publish

# Telegram is configured on the buddy in projects/research.yaml.
# Run `teamctl bot setup` to wire it up.

projects:
  - file: projects/research.yaml
