version: 2

project:
  id: newsletter
  name: Daily newsletter
  cwd: ./workspace

channels:
  # Editor and curator talk continuously; the back-and-forth is the
  # point of the team. One shared channel is enough.
  - name: all
    members: "*"

managers:
  editor:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/editor.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [curator]
    can_broadcast: [all]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_EDITOR_TOKEN
        chat_ids_env: TEAMCTL_TG_EDITOR_CHATS

workers:
  curator:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/curator.md
    permission_mode: auto
    reports_to: editor
    can_dm: [editor]
    can_broadcast: [all]
