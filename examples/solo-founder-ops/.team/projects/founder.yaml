version: 2

project:
  id: founder
  name: Solo founder ops
  cwd: ./workspace

channels:
  - name: all
    members: "*"
  - name: ops
    members: [hub, research, inbox]
  - name: signals
    members: [hub, analytics]

managers:
  hub:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/hub.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [research, inbox, analytics]
    can_broadcast: [all, ops, signals]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_HUB_TOKEN
        chat_ids_env: TEAMCTL_TG_HUB_CHATS

workers:
  # research chases context on whatever the operator needs to think
  # clearly about: competitor moves, prospective hires, technical
  # decisions. Returns briefs, not links.
  research:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/research.md
    permission_mode: auto
    reports_to: hub
    can_dm: [hub]
    can_broadcast: [ops, all]

  # inbox owns the queue of asks coming at the founder: emails,
  # messages, support pings, decisions waiting. drafts replies,
  # keeps the daily journal of what landed and what shipped.
  inbox:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/inbox.md
    permission_mode: auto
    reports_to: hub
    can_dm: [hub]
    can_broadcast: [ops, all]

  # analytics owns the product-metrics surface: tracks the metrics
  # the founder cares about, surfaces anomalies, writes weekly
  # digests. Doesn't make product decisions; surfaces signal.
  analytics:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/analytics.md
    permission_mode: auto
    reports_to: hub
    can_dm: [hub]
    can_broadcast: [signals, all]
