version: 2

broker:
  type: sqlite
  path: state/mailbox.db

supervisor:
  type: tmux
  tmux_prefix: saas-

budget:
  daily_usd_limit: 40.0
  message_ttl_hours: 168 # 7 days. product context compounds over weeks

hitl:
  globally_sensitive_actions:
    - deploy
    - release
    - publish
    - external_email
    - payment

# Telegram is configured on vision in projects/saas.yaml.
# Run `teamctl bot setup` to wire it up.

projects:
  - file: projects/saas.yaml
