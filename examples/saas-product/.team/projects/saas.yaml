version: 2

project:
  id: saas
  name: SaaS product team
  cwd: ./workspace

channels:
  # Three channels carry the team's information architecture:
  # - all: cross-team broadcasts (vision's roadmap, release notes, priorities)
  # - eng: engineering domains coordinate (auth + billing + dashboards)
  # - external: outward-facing surfaces (docs-site + community)
  - name: all
    members: "*"
  - name: eng
    members: [vision, auth, billing, dashboards]
  - name: external
    members: [vision, docs-site, community]

managers:
  vision:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/vision.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [auth, billing, dashboards, docs-site, community]
    can_broadcast: [all, eng, external]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_VISION_TOKEN
        chat_ids_env: TEAMCTL_TG_VISION_CHATS

workers:
  auth:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/auth.md
    permission_mode: auto
    reports_to: vision
    can_dm: [vision, billing, dashboards]
    can_broadcast: [eng, all]

  billing:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/billing.md
    permission_mode: auto
    reports_to: vision
    can_dm: [vision, auth, dashboards]
    can_broadcast: [eng, all]

  dashboards:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/dashboards.md
    permission_mode: auto
    reports_to: vision
    can_dm: [vision, auth, billing]
    can_broadcast: [eng, all]

  docs-site:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/docs-site.md
    permission_mode: auto
    reports_to: vision
    can_dm: [vision, community]
    can_broadcast: [external, all]

  community:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/community.md
    permission_mode: auto
    reports_to: vision
    can_dm: [vision, docs-site]
    can_broadcast: [external, all]
