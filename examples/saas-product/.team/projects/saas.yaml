version: 2

project:
  id: saas
  name: SaaS product team
  cwd: ./workspace

channels:
  # Three channels carry the team's information architecture:
  # - all: cross-team broadcasts (product_lead's roadmap, release notes, priorities)
  # - eng: engineering domains coordinate (platform + auth + billing + dashboards)
  # - external: outward-facing surfaces (docs-site + community)
  - name: all
    members: "*"
  - name: eng
    members: [product_lead, platform, auth, billing, dashboards]
  - name: external
    members: [product_lead, docs-site, community]

managers:
  product_lead:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/product_lead.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [platform, auth, billing, dashboards, docs-site, community]
    can_broadcast: [all, eng, external]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_PRODUCT_LEAD_TOKEN
        chat_ids_env: TEAMCTL_TG_PRODUCT_LEAD_CHATS

workers:
  # platform owns the foundations every other domain pulls from:
  # design system, shared components, build pipeline, observability,
  # the cross-cutting infrastructure that compounds across the product.
  platform:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/platform.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, auth, billing, dashboards]
    can_broadcast: [eng, all]

  auth:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/auth.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, platform, billing, dashboards]
    can_broadcast: [eng, all]

  billing:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/billing.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, platform, auth, dashboards]
    can_broadcast: [eng, all]

  dashboards:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/dashboards.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, platform, auth, billing]
    can_broadcast: [eng, all]

  docs-site:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/docs-site.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, community]
    can_broadcast: [external, all]

  community:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/community.md
    permission_mode: auto
    reports_to: product_lead
    can_dm: [product_lead, docs-site]
    can_broadcast: [external, all]
