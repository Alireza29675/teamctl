version: 2

broker:
  type: sqlite
  path: state/mailbox.db

supervisor:
  type: tmux
  tmux_prefix: jobs-

budget:
  daily_usd_limit: 8.0
  message_ttl_hours: 168 # 7 days. Application history compounds over weeks.

hitl:
  globally_sensitive_actions:
    - external_email
    - publish

# Telegram is configured on the lead in projects/jobs.yaml.
# Run `teamctl bot setup` to wire it up.

projects:
  - file: projects/jobs.yaml
