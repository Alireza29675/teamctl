version: 2

project:
  id: jobs
  name: Job finder
  cwd: ./workspace

channels:
  - name: all
    members: "*"

managers:
  lead:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/lead.md
    # lead's stack: turn the application tracker plus the week's activity
    # into a short, calm "state of the search" digest for the operator.
    subagents:
      - subagents/digest-drafter.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [scout, matcher]
    can_broadcast: [all]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_LEAD_TOKEN
        chat_ids_env: TEAMCTL_TG_LEAD_CHATS

workers:
  # scout watches job boards and aggregators on the operator's declared
  # interests, surfaces postings worth a look to the matcher.
  scout:
    runtime: claude-code
    model: claude-sonnet-4-6
    role_prompt: roles/scout.md
    # scout's stack: a board-sweeper sub-agent does the per-cycle pull
    # across the source list and public career pages — over the web, no
    # API key, runs out of the box. To add a live jobs-API feed, wire a
    # job-board MCP here. There's no official published one as of mid-2026,
    # so clone a community server — e.g. Adzuna (MIT):
    # github.com/folathecoder/adzuna-job-search-mcp — grab free keys at
    # developer.adzuna.com, then uncomment:
    #
    #   mcps:
    #     jobs:
    #       command: python
    #       args: [/path/to/adzuna-job-search-mcp/server.py]   # your clone
    #       env:
    #         ADZUNA_APP_ID: ${ADZUNA_APP_ID}
    #         ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
    subagents:
      - subagents/board-sweeper.md
    permission_mode: auto
    reports_to: lead
    can_dm: [lead, matcher]
    can_broadcast: [all]

  # matcher takes the operator's CV plus a posting and produces an
  # honest fit assessment (with cover letter draft when fit is good).
  matcher:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/matcher.md
    # matcher's stack: score CV-to-posting fit honestly, then draft a
    # cover letter in the operator's voice when the fit is good.
    subagents:
      - subagents/cv-fit-scorer.md
      - subagents/cover-letter-drafter.md
    permission_mode: auto
    reports_to: lead
    can_dm: [lead, scout]
    can_broadcast: [all]
