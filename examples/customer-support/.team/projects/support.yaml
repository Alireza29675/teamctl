version: 2

project:
  id: support
  name: Customer support
  cwd: ./workspace

channels:
  - name: all
    members: "*"

managers:
  triage:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/triage.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: [drafter]
    can_broadcast: [all]
    # Run `teamctl bot setup` to populate.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_TRIAGE_TOKEN
        chat_ids_env: TEAMCTL_TG_TRIAGE_CHATS

workers:
  # drafter writes replies in the operator's voice, given a ticket
  # and the context triage hands over. HITL on send.
  drafter:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/drafter.md
    permission_mode: auto
    reports_to: triage
    can_dm: [triage]
    can_broadcast: [all]
