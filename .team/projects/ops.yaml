version: 2
project:
  id: ops
  name: teamctl ops
  cwd: ..
channels:
- name: all
  members: '*'
managers:
  otto:
    display_name: Otto (TeamOps)
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/otto.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: []
    can_broadcast:
    - all
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_OTTO_TOKEN
        chat_ids_env: TEAMCTL_TG_OTTO_CHATS
        speech_to_text:
          provider: groq
          api_key_env: GROQ_API_KEY
          model: whisper-large-v3
workers: {}
