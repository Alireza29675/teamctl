version: 2
project:
  id: teamctl
  name: teamctl core
  cwd: ..
channels:
- name: all
  members: '*'
- name: dev
  members:
  - hugo
  - ada
  - wren
  - otis
  - kian
  - nico
managers:
  sage:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/sage.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm:
    - hugo
    - neda
    can_broadcast:
    - all
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_SAGE_TOKEN
        chat_ids_env: TEAMCTL_TG_SAGE_CHATS
        speech_to_text:
          provider: groq
          api_key_env: GROQ_API_KEY
          model: whisper-large-v3
  hugo:
    runtime: claude-code
    model: claude-opus-4-7
    role_prompt: roles/hugo.md
