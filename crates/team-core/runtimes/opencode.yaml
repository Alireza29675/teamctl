# Runtime adapter: OpenCode CLI
#
# Launched by the `opencode)` case in `bin/agent-wrapper.sh`.
# MCP stdio: opencode has no --mcp-config flag; servers are read from
# the `mcp` object of the per-agent opencode.json that team-core renders
# under state/opencode-home/ and points OPENCODE_CONFIG at.
# Session resume: the OPENCODE_DB env var relocates the session sqlite
# db, so each agent gets its own db under its opencode home and the
# wrapper reopens the prior conversation with `-c` (--continue). `-c`
# resolves "the last session in the current directory" — exact per
# agent, because the isolated db holds only that agent's sessions.
#
# No default_model: opencode defaults to the priciest model the account
# is authed for. ALWAYS set `model:` on opencode agents, in
# provider/model form (e.g. `openai/gpt-5.4-mini-fast`).
#
# Provenance: every mechanism named here (`-c`, `--prompt`, `--auto`,
# OPENCODE_DB, OPENCODE_CONFIG, the config schema, the missing-auth
# free-tier fallback, the in-place binary autoupdate) was EMPIRICALLY
# VERIFIED against opencode 1.17.13/1.17.18 on this machine, 2026-07-13.
# NOTE: OPENCODE_DB is present in the binary but UNDOCUMENTED upstream —
# re-verify it (and the rest of this surface) on opencode version bumps.

binary: opencode
supports_mcp: true
session_resume: "continue"

# Best-effort matchers mirroring codex's generic pair: upstream has no
# stable 429 wording and some providers retry silently, so these catch
# the verbose failures only. A stall heuristic is the real answer —
# tracked as a follow-up.
rate_limit_patterns:
  - match: "(?i)rate.?limit"
    resets_in_capture: "(?i)(?:retry|try again|wait)\\s*(?:in|after)?\\s*([0-9]+\\s*(?:s|sec|m|min|h|hr)[a-z]*)"
  - match: "(?i)quota (?:exceeded|reached)"
    resets_at_capture: "(?i)reset(?:s)? (?:at|on) ([0-9]{1,2}:[0-9]{2}(?:\\s*[A-Z]{2,5})?)"
