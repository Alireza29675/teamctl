# Runtime adapter: OpenAI Codex CLI
#
# Launched by the `codex)` case in `bin/agent-wrapper.sh`.
# MCP stdio: codex has no --mcp-config flag; servers are read from
# [mcp_servers.*] tables in the per-agent CODEX_HOME/config.toml that
# team-core renders under state/codex-home/.
# Session resume: profile-based (see `--profile`).
#
# No default_model: codex picks its own configured default; upstream
# model names rotate too fast to pin here.

binary: codex
supports_mcp: true
session_resume: "profile"

rate_limit_patterns:
  - match: "(?i)rate.?limit"
    resets_in_capture: "(?i)(?:retry|try again|wait)\\s*(?:in|after)?\\s*([0-9]+\\s*(?:s|sec|m|min|h|hr)[a-z]*)"
  - match: "(?i)quota (?:exceeded|reached)"
    resets_at_capture: "(?i)reset(?:s)? (?:at|on) ([0-9]{1,2}:[0-9]{2}(?:\\s*[A-Z]{2,5})?)"
