# Runtime adapter: OpenAI Codex CLI
#
# Launched by the `codex)` case in `bin/agent-wrapper.sh`.
# MCP stdio: codex has no --mcp-config flag; servers are read from
# [mcp_servers.*] tables in the per-agent CODEX_HOME/config.toml that
# team-core renders under state/codex-home/.
# Session resume: rollout JSONLs ride the per-agent CODEX_HOME, so the
# wrapper probes its sessions/ dir and reopens the newest one with
# `codex resume --last`. Upstream has no deterministic session-id
# flag — the isolated store is what makes --last exact.
#
# No default_model: codex picks its own configured default; upstream
# model names rotate too fast to pin here.
#
# Provenance: the flag surface (`-c model_instructions_file` /
# `-c model_reasoning_effort`, `-a`/`-s`/`--yolo`, `resume --last`, the
# sessions/ layout, trust-dialog wording) was verified against the
# upstream docs and the openai/codex issue tracker as of July 2026 —
# NOT against a locally-run binary. `-c` keys fail SILENTLY if renamed
# upstream, so re-verify this surface on codex CLI version bumps.

binary: codex
supports_mcp: true
session_resume: "resume-last"

rate_limit_patterns:
  - match: "(?i)rate.?limit"
    resets_in_capture: "(?i)(?:retry|try again|wait)\\s*(?:in|after)?\\s*([0-9]+\\s*(?:s|sec|m|min|h|hr)[a-z]*)"
  - match: "(?i)quota (?:exceeded|reached)"
    resets_at_capture: "(?i)reset(?:s)? (?:at|on) ([0-9]{1,2}:[0-9]{2}(?:\\s*[A-Z]{2,5})?)"
