# projects/main.yaml — the Ideate & Build team.
#
# Four agents: the Executor (manager you talk to on Telegram), Compass
# (manager, a private one-way ideation partner), and two engineers
# (workers who do the building). Product-agnostic on purpose — nothing
# here names a codebase. The Executor onboards you and writes what
# you're building into `charter.md`.

version: 2

project:
  id: main
  name: Ideate & Build
  # The repo this team operates on is the one `.team/` lives inside.
  # `..` resolves to the parent of this `.team/` directory.
  cwd: ..

channels:
  # The build team — announcements, status, coordination. Explicit list
  # (not '*') so Compass stays out: it's a private, one-way line to the
  # Executor, not a team member.
  - name: all
    members:
      - executor
      - engineer_1
      - engineer_2
  # Engineers-only room. Where the two engineers coordinate, trade
  # heads-ups before touching the same area, and sharpen each other's
  # work. The Executor is not a member — this is theirs.
  - name: eng
    members:
      - engineer_1
      - engineer_2

managers:
  executor:
    display_name: Executor
    runtime: claude-code
    role_prompt:
      - roles/_base.md
      - roles/_telegram.md
      - roles/executor.md
    # The Executor's one sub-agent: turn an engineer's ready PR into a
    # plain-language approve/merge summary it can forward to you on
    # Telegram, so the decision reaches you without the diff.
    subagents:
      - subagents/pr-summarizer.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm:
      - engineer_1
      - engineer_2
    can_broadcast:
      - all
    # The 1:1 Telegram bot you talk to. `teamctl bot setup` fills these
    # env vars in.
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_EXECUTOR_TOKEN
        chat_ids_env: TEAMCTL_TG_EXECUTOR_CHATS

  # Ideation partner. You talk to it directly (text or voice); it helps
  # you figure out what to build next and shapes each idea before it
  # reaches the build team. One-way to the Executor: it can DM a shaped
  # idea over, but the Executor can't DM back (not in executor.can_dm)
  # and can't reach it on a channel (not in `all`). It never instructs
  # the Executor on its own. Use a SEPARATE Telegram bot from the
  # Executor.
  compass:
    display_name: Compass
    runtime: claude-code
    role_prompt:
      - roles/_base.md
      - roles/_telegram.md
      - roles/compass.md
    # Compass's investigation sub-agents (see roles/compass.md): capture
    # ideas to memory, and ground ideation with code / prior-art / market /
    # domain research. All read-only except memory-writer, which writes
    # only the idea notes it's fed. `deep-research` and `learn` are this
    # team's own bespoke sub-agents — self-contained, not the host's
    # ambient skills.
    subagents:
      - subagents/memory-writer.md
      - subagents/code-investigator.md
      - subagents/product-researcher.md
      - subagents/feasibility-analyst.md
      - subagents/deep-research.md
      - subagents/learn.md
      - subagents/ideator.md
    permission_mode: auto
    autonomy: low_risk_only
    can_dm:
      - executor
    can_broadcast: []
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_COMPASS_TOKEN
        chat_ids_env: TEAMCTL_TG_COMPASS_CHATS

workers:
  # Both engineers run the identical role — only their number differs.
  # They figure out which one they are from their own id.
  engineer_1:
    display_name: Engineer 1
    runtime: claude-code
    role_prompt:
      - roles/_base.md
      - roles/_engineer.md
    # The engineer's stable of sub-agents (see roles/_engineer.md §2).
    # Each is a sub-agent markdown file under `subagents/`; teamctl renders
    # them into Claude Code's `--agents` so this agent can spin them up,
    # on top of any project- or user-level sub-agents.
    subagents:
      - subagents/code-investigator.md
      - subagents/implementer.md
      - subagents/test-author.md
      - subagents/qa-tester.md
      - subagents/pr-narrator.md
      - subagents/code-roaster.md
      - subagents/code-review.md
      - subagents/security-review.md
    permission_mode: auto
    autonomy: low_risk_only
    reports_to: executor
    can_dm:
      - executor
      - engineer_2
    can_broadcast:
      - all
      - eng

  engineer_2:
    display_name: Engineer 2
    runtime: claude-code
    role_prompt:
      - roles/_base.md
      - roles/_engineer.md
    # The engineer's stable of sub-agents (see roles/_engineer.md §2).
    # Each is a sub-agent markdown file under `subagents/`; teamctl renders
    # them into Claude Code's `--agents` so this agent can spin them up,
    # on top of any project- or user-level sub-agents.
    subagents:
      - subagents/code-investigator.md
      - subagents/implementer.md
      - subagents/test-author.md
      - subagents/qa-tester.md
      - subagents/pr-narrator.md
      - subagents/code-roaster.md
      - subagents/code-review.md
      - subagents/security-review.md
    permission_mode: auto
    autonomy: low_risk_only
    reports_to: executor
    can_dm:
      - executor
      - engineer_1
    can_broadcast:
      - all
      - eng
