# projects/ops.yaml — the helper team.
#
# One agent, `ops`, whose job is to scaffold and evolve `main`
# for you. Talk to it on Telegram once you've wired the bot token
# (see `.env.example`).
#
# Don't edit this file unless you know what you're doing — reshaping
# the ops project can leave you without a helper.

version: 2

project:
  id: ops
  name: Ops
  cwd: ./workspace

channels:
  - name: all
    members: "*"

managers:
  ops:
    runtime: claude-code
    model: claude-opus-4-8
    role_prompt: roles/ops.md
    # `auto` lets the ops agent run tools without per-action HITL;
    # `low_risk_only` keeps destructive operations (rm, force, push)
    # behind a `request_approval` gate, which lands in your Telegram
    # chat with the ops agent.
    permission_mode: auto
    autonomy: low_risk_only
    can_dm: []
    can_broadcast: [all]
    interfaces:
      telegram:
        bot_token_env: TEAMCTL_TG_OPS_TOKEN
        chat_ids_env: TEAMCTL_TG_OPS_CHATS

workers: {}
