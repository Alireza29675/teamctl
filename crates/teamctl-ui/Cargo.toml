[package]
name = "teamctl-ui"
version.workspace = true
edition.workspace = true
# Higher than the workspace MSRV (1.86): the ratatui 0.29 dep tree pulls
# `instability`/`darling`, which require Rust 1.88. teamctl-ui is an opt-in
# crate installed separately (`cargo install teamctl-ui`), so this does not
# raise the CLI's advertised MSRV — it just states this crate's real floor.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Interactive TUI for teamctl — Triptych view, approvals modal, send-mail compose."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
ratatui.workspace = true
crossterm.workspace = true
dirs = "5"
team-core.workspace = true
rusqlite.workspace = true
notify.workspace = true
ansi-to-tui = "7"
# T-209: bottom status bar reads system CPU% + RAM% from sysinfo. Pin
# default-features = false + only the "system" feature to drop the
# disk/network/component/user crates we don't render — keeps the
# compile cost trimmed and the runtime surface narrow.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# T-131 PR-3: detail modal renders the mailbox row's `sent_at` (f64
# Unix epoch) as an absolute timestamp with timezone. Mirrors
# team-core's pattern (default-features = false + "clock") so we
# pull in only the date-format surface, not the locale/serde extras.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"
