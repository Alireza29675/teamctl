name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      # tools/install.sh is the source of truth for https://teamctl.run/install
      # (the "Sync install.sh into docs/public" step below regenerates the
      # served file from it). Without this path, a tools/install.sh-only change
      # merges to main but never redeploys — the live endpoint silently drifts
      # from the in-repo installer. This was the #322 P0. Keep it here.
      - 'tools/install.sh'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # docs/public/install is regenerated from tools/install.sh on every
      # build so https://teamctl.run/install always matches the in-repo
      # installer with no human sync step. tools/install.sh is the single
      # source of truth; docs/public/install is .gitignored.
      - name: Sync install.sh into docs/public
        run: install -m 0755 tools/install.sh docs/public/install
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run build
      - name: Link check (internal, fail on broken)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/docs/dist" 'docs/dist/**/*.html'
          fail: true
      - name: Link check (external, warn-only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        continue-on-error: true
        with:
          args: --no-progress --max-concurrency 4 --root-dir "${{ github.workspace }}/docs/dist" 'docs/dist/**/*.html'
          fail: false
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=teamctl-docs
