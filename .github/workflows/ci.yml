name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.rust }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        rust: [stable, "1.78"]
        # T-192: add a macOS runner so darwin-flavor regressions
        # (bash 3.2 wrapper parse-fails, FS quirks, tmux behaviour
        # differences) get caught at PR time instead of in operator
        # debug-night. Scoped to rust=stable only — MSRV coverage
        # on Linux is sufficient and a second macOS combo would
        # double the cost for marginal additional signal.
        include:
          # T-284: macos-14, not macos-latest — matches Cargo.toml's
          # `github-custom-runners` darwin pin so CI exercises the
          # same image the release binaries are cut on. This is a
          # release-path-parity consistency win, NOT the RED-main
          # fix: the actual blocker is the rust-stub-shim problem
          # handled in the purge step below (present on macos-14 and
          # macos-latest alike — proven by this PR's own CI). Keep
          # the two configs in lockstep; do not float back to
          # macos-latest.
          - os: macos-14
            rust: stable
    steps:
      - uses: actions/checkout@v4
      # T-284: current GitHub macOS ARM runner images pre-seed
      # `rustup-init` stub shims for cargo/rustc/rustup/rustfmt into
      # ~/.cargo/bin (and /opt/homebrew/bin). dtolnay/rust-toolchain
      # installs a real toolchain, but because ~/.cargo/bin/cargo is
      # itself the stub, every `cargo …` step execs `rustup-init` and
      # dies with `error: unexpected argument 'fmt' found`. This is a
      # stub-precedence problem, not the image-version drift the
      # ticket first read it as — it reproduces on macos-14 too.
      # Purge the seeded stubs before the toolchain action so dtolnay
      # populates a clean prefix with real proxies. The diagnostic
      # echo is deliberate: if a future image changes the stub layout,
      # this one job log tells you PATH + which-cargo + dir contents
      # without a repro round-trip.
      - name: macOS — purge pre-seeded rust stub shims
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$PATH"
          which -a cargo rustup rustfmt || true
          ls -la "$HOME/.cargo/bin" 2>/dev/null || true
          rm -f "$HOME"/.cargo/bin/{cargo,cargo-clippy,cargo-fmt,clippy-driver,rls,rust-analyzer,rust-gdb,rust-lldb,rustc,rustdoc,rustfmt,rustup} \
                /opt/homebrew/bin/{cargo,cargo-clippy,cargo-fmt,clippy-driver,rustc,rustdoc,rustfmt,rustup} 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # T-193: Linux runners use bash 4+ / dash for `/bin/sh`, so
      # bash 3.2 parser bugs (e.g. `${VAR:=DEFAULT}` failing on
      # escape sequences in DEFAULT) ship silently — exactly the
      # 0.8.0 macOS fresh-install regression #190. Run a fast
      # parse-check on every Linux PR using both `dash -n` (strict
      # POSIX baseline) and `bash --posix -O compat32 -n` (mimics
      # macOS bash 3.2 byte-for-byte on the parser path). These
      # are sub-second; they fail fast before the slower test
      # matrix kicks in. The macOS runner above catches the same
      # class for real, but at much higher cost — keep both.
      - name: Wrapper script — POSIX shell parse check
        if: matrix.os == 'ubuntu-24.04'
        run: dash -n crates/teamctl/assets/agent-wrapper.sh
      - name: Wrapper script — bash 3.2 compat parse check
        if: matrix.os == 'ubuntu-24.04'
        run: bash --posix -O compat32 -n crates/teamctl/assets/agent-wrapper.sh
      - run: cargo fmt --all -- --check
        if: matrix.rust == 'stable'
      - run: cargo build --all-targets --locked
      - run: cargo test --all --locked
      # `teamctl-ui` is excluded from `default-members` (it pulls
      # the ratatui dep tree that the release flow doesn't need)
      # but its tests must still gate on green. Build + test +
      # clippy it explicitly so the workspace exclusion never
      # hides regressions from CI (T-T058a, qa observation
      # across PR #34/#35/#36).
      - run: cargo build -p teamctl-ui --all-targets --locked
      - run: cargo test -p teamctl-ui --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo clippy -p teamctl-ui --all-targets --locked -- -D warnings
        if: matrix.rust == 'stable'
