name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.rust }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # T-397: force the matrix toolchain to be the *active* one for every cargo
    # invocation. The repo's rust-toolchain.toml pins channel=stable, and a
    # rust-toolchain.toml directory override outranks the `rustup default` that
    # dtolnay/rust-toolchain sets — so without this the MSRV leg silently ran
    # `stable` and never tested the MSRV (the old `1.78` leg was green against
    # clap_lex 1.1.0, a crate 1.78 cannot even parse). RUSTUP_TOOLCHAIN outranks
    # rust-toolchain.toml, making the matrix authoritative. See the assert below.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        rust: [stable, "1.86"]
        # T-192: add a macOS runner so darwin-flavor regressions
        # (bash 3.2 wrapper parse-fails, FS quirks, tmux behaviour
        # differences) get caught at PR time instead of in operator
        # debug-night. Scoped to rust=stable only — MSRV coverage
        # on Linux is sufficient and a second macOS combo would
        # double the cost for marginal additional signal.
        include:
          # T-284: macos-14, not macos-latest — matches Cargo.toml's
          # `github-custom-runners` darwin pin so CI exercises the
          # same image the release binaries are cut on. This is a
          # release-path-parity consistency win, NOT the RED-main
          # fix: the actual blocker is the rust-stub-shim problem
          # handled in the purge step below (present on macos-14 and
          # macos-latest alike — proven by this PR's own CI). Keep
          # the two configs in lockstep; do not float back to
          # macos-latest.
          - os: macos-14
            rust: stable
    steps:
      - uses: actions/checkout@v4
      # T-284: current GitHub macOS ARM runner images pre-seed
      # `rustup-init` stub shims for cargo/rustc/rustup/rustfmt into
      # ~/.cargo/bin (and /opt/homebrew/bin). dtolnay/rust-toolchain
      # installs a real toolchain, but because ~/.cargo/bin/cargo is
      # itself the stub, every `cargo …` step execs `rustup-init` and
      # dies with `error: unexpected argument 'fmt' found`. This is a
      # stub-precedence problem, not the image-version drift the
      # ticket first read it as — it reproduces on macos-14 too.
      # Purge the seeded stubs before the toolchain action so dtolnay
      # populates a clean prefix with real proxies. The diagnostic
      # echo is deliberate: if a future image changes the stub layout,
      # this one job log tells you PATH + which-cargo + dir contents
      # without a repro round-trip.
      - name: macOS — purge pre-seeded rust stub shims
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$PATH"
          which -a cargo rustup rustfmt || true
          ls -la "$HOME/.cargo/bin" 2>/dev/null || true
          rm -f "$HOME"/.cargo/bin/{cargo,cargo-clippy,cargo-fmt,clippy-driver,rls,rust-analyzer,rust-gdb,rust-lldb,rustc,rustdoc,rustfmt,rustup} \
                /opt/homebrew/bin/{cargo,cargo-clippy,cargo-fmt,clippy-driver,rustc,rustdoc,rustfmt,rustup} 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # T-397: prove the matrix toolchain is the one actually in use. The MSRV
      # leg used to run `stable` (rust-toolchain.toml shadow, fixed by
      # RUSTUP_TOOLCHAIN above); this step fails loudly if that ever regresses,
      # so the MSRV guard can never silently stop testing the MSRV again. A
      # guard that doesn't fail on a real violation is worse than none.
      - name: Assert the matrix toolchain is active
        # EXPECTED comes from the matrix via env (not templated into the shell
        # source); the glob anchors the trailing dot so `1.86` matches `1.86.0`
        # but never `1.860`. RUSTUP_TOOLCHAIN selects the toolchain dtolnay
        # installed under this same bare name.
        env:
          EXPECTED: ${{ matrix.rust }}
        run: |
          echo "cargo: $(cargo --version)"
          echo "rustc: $(rustc --version)"
          if [ "$EXPECTED" != 'stable' ]; then
            got=$(rustc --version | awk '{print $2}')
            case "$got" in
              "$EXPECTED".*) echo "ok: MSRV toolchain $got is active" ;;
              *) echo "::error::MSRV guard shadowed — expected $EXPECTED, active toolchain is $got"; exit 1 ;;
            esac
          fi
      # T-193: Linux runners use bash 4+ / dash for `/bin/sh`, so
      # bash 3.2 parser bugs (e.g. `${VAR:=DEFAULT}` failing on
      # escape sequences in DEFAULT) ship silently — exactly the
      # 0.8.0 macOS fresh-install regression #190. Run a fast
      # parse-check on every Linux PR using both `dash -n` (strict
      # POSIX baseline) and `bash --posix -O compat32 -n` (mimics
      # macOS bash 3.2 byte-for-byte on the parser path). These
      # are sub-second; they fail fast before the slower test
      # matrix kicks in. The macOS runner above catches the same
      # class for real, but at much higher cost — keep both. Covers
      # every shipped managed shell asset: the agent wrapper and the
      # #430/#439 boot-context hook (T-439 grew the latter into real
      # shell logic, so it earns the same gate).
      - name: Managed shell assets — POSIX shell parse check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          dash -n crates/teamctl/assets/agent-wrapper.sh
          dash -n crates/teamctl/assets/boot.sh
      - name: Managed shell assets — bash 3.2 compat parse check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          bash --posix -O compat32 -n crates/teamctl/assets/agent-wrapper.sh
          bash --posix -O compat32 -n crates/teamctl/assets/boot.sh
      - run: cargo fmt --all -- --check
        if: matrix.rust == 'stable'
      # T-397: the MSRV leg verifies only that the *shipped CLI* — the four
      # default-members (team-core, teamctl, team-mcp, team-bot), lib + bins —
      # compiles on the MSRV toolchain. That is exactly what `cargo install
      # teamctl` builds. By Cargo convention MSRV covers what users build and
      # install, so two things are deliberately out of scope here and run only
      # on the stable leg below:
      #   - dev-dependencies (e.g. wiremock, test-only, edition 2024); and
      #   - the opt-in `teamctl-ui` crate (installed separately via
      #     `cargo install teamctl-ui`, excluded from default-members and
      #     release bundles) — its ratatui dep tree (instability/darling) needs
      #     a newer rustc than the CLI and shouldn't inflate the CLI's MSRV.
      # So the MSRV leg builds default-members without --all-targets and runs no
      # tests; the full --all-targets build + tests run on the stable leg.
      - run: cargo build --locked
        if: matrix.rust != 'stable'
      - run: cargo build --all-targets --locked
        if: matrix.rust == 'stable'
      - run: cargo test --all --locked
        if: matrix.rust == 'stable'
      # `teamctl-ui` is excluded from `default-members` (it pulls
      # the ratatui dep tree that the release flow doesn't need)
      # but its tests must still gate on green. Build + test +
      # clippy it explicitly so the workspace exclusion never
      # hides regressions from CI (T-T058a, qa observation
      # across PR #34/#35/#36).
      - run: cargo build -p teamctl-ui --all-targets --locked
        if: matrix.rust == 'stable'
      - run: cargo test -p teamctl-ui --locked
        if: matrix.rust == 'stable'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo clippy -p teamctl-ui --all-targets --locked -- -D warnings
        if: matrix.rust == 'stable'
