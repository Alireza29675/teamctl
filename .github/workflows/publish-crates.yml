name: publish-crates

# Push every crate to crates.io after a release tag.
# Runs in parallel with cargo-dist's `Release` workflow (same trigger);
# they don't share state. crates.io publishing is independent of the
# GitHub Release / Homebrew tap that cargo-dist produces.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check workspace version matches tag
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws_version="$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag" != "$ws_version" ]; then
            echo "::error::tag $tag does not match workspace version $ws_version"
            exit 1
          fi

      # #399: verify the advertised MSRV floor before publishing, so a release
      # can never ship a crate that no longer builds on its declared
      # `rust-version`. Mirrors `just msrv-check` (justfile): reads the floor
      # from Cargo.toml (never hardcoded) and builds the default-members (the
      # shipped CLI crates; `teamctl-ui` has a higher floor and is excluded).
      # Relies on `rustup` being on PATH from the toolchain action above; if
      # that action is ever swapped, restore a rustup install here too.
      - name: Verify MSRV floor before publishing
        run: |
          msrv="$(grep -E '^rust-version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "MSRV floor: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" build --locked

      # Order matters: team-core has no internal deps and must publish first.
      - name: Publish team-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p team-core --locked

      - name: Wait for crates.io index to refresh
        run: sleep 30

      - name: Publish team-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p team-mcp --locked

      - name: Publish teamctl
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p teamctl --locked

      - name: Publish team-bot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p team-bot --locked

      # teamctl-ui depends only on team-core (already published above);
      # `teamctl ui` resolves to `cargo install teamctl-ui` so this crate
      # must reach crates.io for the install path to work.
      - name: Publish teamctl-ui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p teamctl-ui --locked
