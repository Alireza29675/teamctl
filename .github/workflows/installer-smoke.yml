name: installer-smoke

# Smoke-test the curl-pipe installer against the latest published release on
# Linux + macOS. Catches drift between `tools/install.sh`, the cargo-dist
# release tarballs, and (eventually) the teamctl.run/install endpoint.
#
# Triggers:
# - push to main when the script or this workflow changes
# - weekly schedule, so we notice if the GH Releases or teamctl.run hosting
#   silently breaks between teamctl releases
# - manual dispatch
#
# Note: until dev2's T-004 (teamctl.run docs/route) lands, we point at the
# raw GitHub URL for the script. After T-004, swap INSTALLER_URL to
# https://teamctl.run/install.
#
# Step-order class-fix (#324, lineage from #322/#323): the "local script
# under test" step runs FIRST and is the only fail-closed acceptance gate;
# the "network" step runs after with `continue-on-error: true` as
# drift-detection only. Previously the network step ran first under `set
# -eu` at job level, which fail-closed the WHOLE job on a step that — for
# any PR that fixes `tools/install.sh` — tests the *old* main script
# against the *new* release artifacts by construction. That made the
# acceptance step structurally unreachable on exactly the PRs it most
# needed to validate (the #322 P0 fix had to be proven by manual end-to-end
# instead). Keeping the network step in the same job preserves drift
# signal on schedule / push-to-main / dispatch without letting drift gate
# PR acceptance.

on:
  push:
    branches: [main]
    paths:
      - 'tools/install.sh'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    paths:
      - 'tools/install.sh'
      - '.github/workflows/installer-smoke.yml'
  schedule:
    - cron: '0 12 * * 1'  # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    name: smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      INSTALLER_URL: https://raw.githubusercontent.com/Alireza29675/teamctl/main/tools/install.sh
      TEAMCTL_INSTALL_DIR: ${{ github.workspace }}/.teamctl-bin
    steps:
      - uses: actions/checkout@v4

      # Pre-resolve the latest release tag via authenticated `gh` so the
      # installer's own `curl ... releases/latest` doesn't hit the 60-req/hour
      # IP-based rate limit on shared CI runner pools (macOS-14 routinely
      # 403s here). install.sh honours TEAMCTL_VERSION as an env override
      # and skips its own latest-resolver when the env var is set.
      - name: Resolve latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$(gh release view --repo Alireza29675/teamctl --json tagName -q .tagName)"
          echo "TEAMCTL_VERSION=$tag" >> "$GITHUB_ENV"
          echo "resolved latest tag: $tag"

      # ──────────────────────────────────────────────────────────────────
      # Acceptance gate (#324): runs FIRST, fail-closed. The PR's actual
      # `tools/install.sh` is what gates the job result.
      # ──────────────────────────────────────────────────────────────────
      - name: Run installer (local script under test, pinned latest)
        run: |
          set -eu
          mkdir -p "$TEAMCTL_INSTALL_DIR"
          sh ./tools/install.sh

      - name: Verify binaries on PATH (local script)
        run: |
          set -eu
          export PATH="$TEAMCTL_INSTALL_DIR:$PATH"
          teamctl --version
          team-mcp --version
          team-bot --version
          # Use `command -v` because the published `teamctl-ui` binary
          # predates the --version fix in 0.7.4; the LOCAL build has the
          # fix and is pinned by crates/teamctl-ui/tests/cli.rs.
          # Once 0.7.4+ is the deployed `teamctl-ui`, this can become
          # `teamctl-ui --version`.
          command -v teamctl-ui

      # ──────────────────────────────────────────────────────────────────
      # Drift detection (#324): runs AFTER the acceptance gate with
      # `continue-on-error: true` so it never gates the job. Tests the
      # currently-deployed main-branch installer against the latest release
      # artifacts — useful on schedule / push-to-main / dispatch as a
      # standing drift sentinel; for PRs it just surfaces "main's currently
      # -deployed script is broken vs the latest release" without blocking
      # the PR's own acceptance signal (the #322/#323 trap).
      # ──────────────────────────────────────────────────────────────────
      - name: Run installer (network — drift detection, non-gating)
        continue-on-error: true
        run: |
          set -eu
          rm -rf "$TEAMCTL_INSTALL_DIR"
          mkdir -p "$TEAMCTL_INSTALL_DIR"
          curl -fsSL "$INSTALLER_URL" | sh

      - name: Verify binaries on PATH (network — drift detection, non-gating)
        continue-on-error: true
        # The network step pulls main's currently-deployed installer, which
        # may install fewer binaries than the local script under test. Only
        # `teamctl` is asserted here; drift in the rest is visible from this
        # step's pass/fail badge without gating the job.
        run: |
          set -eu
          export PATH="$TEAMCTL_INSTALL_DIR:$PATH"
          teamctl --version
