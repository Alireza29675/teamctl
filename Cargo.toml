[workspace]
resolver = "2"
members = [
    "crates/team-core",
    "crates/teamctl",
    "crates/team-mcp",
    "crates/team-bot",
    "crates/teamctl-ui",
]
# `teamctl-ui` is opt-in: it pulls a TUI dep tree (ratatui + crossterm)
# that the release flow + cargo-dist bundles don't need. Plain
# `cargo build` / `cargo test` target only the four default members
# below; the TUI crate is built with `-p teamctl-ui` or `--workspace`.
default-members = [
    "crates/team-core",
    "crates/teamctl",
    "crates/team-mcp",
    "crates/team-bot",
]

[workspace.package]
version = "0.8.6"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/Alireza29675/teamctl"
homepage = "https://teamctl.run"
authors = ["Alireza Sheikholmolouki <alireza.sheikholmolouki@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
yaml-edit = { version = "0.2", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
schemars = "0.8"
team-core = { path = "crates/team-core", version = "0.8.6" }
blake3 = "1"
uuid = { version = "1", features = ["v5"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
# rustls only — same posture as teloxide (see crates/team-bot/Cargo.toml).
# native-tls would drag in openssl-sys and break the cargo-dist static
# musl Linux build (#294 — zero C TLS deps is what keeps it clean).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# cargo-dist: release binaries for Linux + macOS (4 targets, each
# built natively on its own-arch runner).
# See https://github.com/axodotdev/cargo-dist
[workspace.metadata.dist]
cargo-dist-version = "0.25.1"
ci = "github"
# `allow-dirty = ["ci"]` tells `dist host` to skip the workflow
# freshness check: we hand-edit release.yml (the tarball smoke-test
# block, and the disabled homebrew-publish job) so the generated and
# committed workflows differ by design.
allow-dirty = ["ci"]
installers = ["shell", "homebrew"]
tap = "Alireza29675/homebrew-teamctl"
publish-jobs = ["homebrew"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
pr-run-mode = "plan"
install-path = "~/.local/bin"
# cargo-dist 0.25.1's default runner labels are retired by GitHub
# Actions (`ubuntu-20.04`, `macos-13` — removed 2025-2026); jobs that
# target them sit queued forever, so every target is pinned to a
# currently-supported image.
#
# The Linux targets are static musl (#294): the binary links libc
# statically and has zero glibc dependency, so the build runner's
# glibc no longer matters — there is no glibc floor and no #253-class
# failure to defer (this supersedes the #253 ubuntu-22.04 stopgap and
# retires its ~2027 forced-move horizon). Each Linux arch builds
# NATIVELY on its own runner — x86_64 on ubuntu-24.04, aarch64 on
# ubuntu-24.04-arm (GitHub ARM Linux runners, GA + free for public
# repos since 2025) — so `ring`'s cc-rs C parts compile against the
# native musl toolchain (cargo-dist auto-installs `musl-tools`). No
# cross toolchain, no qemu, no zigbuild, hence no aarch64 cross-gcc
# apt dependency.
github-custom-runners = { x86_64-unknown-linux-musl = "ubuntu-24.04", aarch64-unknown-linux-musl = "ubuntu-24.04-arm", x86_64-apple-darwin = "macos-14", aarch64-apple-darwin = "macos-14" }

[profile.dist]
inherits = "release"
